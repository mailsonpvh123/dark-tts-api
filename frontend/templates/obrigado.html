{% extends "base.html" %}

{% block content %}
<section class="min-h-[80vh] flex flex-col items-center justify-center p-4 text-center animate-fade-in">
    <div class="w-32 h-32 rounded-full bg-emerald-500/20 flex items-center justify-center mb-8 relative">
        <div class="absolute inset-0 rounded-full border-4 border-emerald-500/50 animate-ping"></div>
        <i class="fa-solid fa-check text-6xl text-emerald-500"></i>
    </div>
    
    <h1 class="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">
        Pagamento <span class="text-emerald-400">Aprovado!</span>

    </p>
