{% extends "base.html" %}

{% block content %}
<section id="aba_voice" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-purple-500/10 flex items-center justify-center border border-purple-500/20">
                <i class="fa-solid fa-microphone-lines text-purple-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Voice Synthesizer</h1>
        </div>
        <p class="text-zinc-400">Sintetize vozes com perfeição utilizando a nossa API Neural.</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-purple-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 relative z-10">
                    <i class="fa-solid fa-database text-purple-500"></i> Dados da Narração
                </h2>
                
                <div class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5 flex justify-between"><span>Texto Formatado <span class="text-purple-500">*</span></span></label>
                        <textarea id="texto_voz" rows="8" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-3 text-zinc-200 focus:outline-none focus:border-purple-500 transition-colors resize-y shadow-inner"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-[#121214] p-5 rounded-xl border border-zinc-800/80 shadow-inner">
                        <div>
                            <div class="mb-3 flex justify-between items-center text-xs text-zinc-400 font-medium">
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-purple-500/80"></i> Velocidade</span>
                                <span class="bg-zinc-800 px-2 py-0.5 rounded text-purple-400 font-bold border border-zinc-700"><span id="val_v">1.0x</span></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="ajustarVelocidade(-0.1)" class="w-7 h-7 flex-shrink-0 rounded bg-zinc-800 border border-zinc-700 text-zinc-400 hover:text-purple-400 hover:border-purple-500 transition-colors flex items-center justify-center focus:outline-none"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                <input type="range" id="velocidade" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('val_v').innerText=parseFloat(this.value).toFixed(1) + 'x'" class="flex-1 cursor-pointer">
                                <button onclick="ajustarVelocidade(0.1)" class="w-7 h-7 flex-shrink-0 rounded bg-zinc-800 border border-zinc-700 text-zinc-400 hover:text-purple-400 hover:border-purple-500 transition-colors flex items-center justify-center focus:outline-none"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            </div>
                        </div>
                        
                        <div>
                            <div class="mb-3 flex justify-between items-center text-xs text-zinc-400 font-medium">
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-music text-purple-500/80"></i> Tom (Pitch)</span>
                                <span class="bg-zinc-800 px-2 py-0.5 rounded text-purple-400 font-bold border border-zinc-700"><span id="val_p">0Hz</span></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="ajustarPitch(-1)" class="w-7 h-7 flex-shrink-0 rounded bg-zinc-800 border border-zinc-700 text-zinc-400 hover:text-purple-400 hover:border-purple-500 transition-colors flex items-center justify-center focus:outline-none"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                <input type="range" id="pitch" min="-50" max="50" step="1" value="0" oninput="document.getElementById('val_p').innerText=this.value+'Hz'" class="flex-1 cursor-pointer">
                                <button onclick="ajustarPitch(1)" class="w-7 h-7 flex-shrink-0 rounded bg-zinc-800 border border-zinc-700 text-zinc-400 hover:text-purple-400 hover:border-purple-500 transition-colors flex items-center justify-center focus:outline-none"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button id="btn_gerar_voz" onclick="gerarAudioCompleto()" class="mt-6 w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 px-6 rounded-lg shadow-[0_0_20px_rgba(168,85,247,0.4)] transition-all flex items-center justify-center gap-2 group border border-purple-500/50 relative z-10">
                    <i class="fa-solid fa-wand-magic-sparkles group-hover:scale-110 transition-transform"></i> <span>Sintetizar Voz (380 coins)</span>
                </button>
                
                <div id="player_container" class="mt-6 hidden bg-emerald-500/5 p-5 rounded-xl border border-emerald-500/20 shadow-inner relative z-10"></div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl h-full flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-purple-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                <div class="flex items-center justify-between mb-4 border-b border-zinc-800/80 pb-2 relative z-10">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2"><i class="fa-solid fa-users text-purple-500"></i> Atores Neurais</h2>
                </div>
                <div id="lista_vozes" class="flex-1 max-h-[500px] overflow-y-auto space-y-3 pr-2 custom-scrollbar relative z-10">
                    <div class="text-center text-zinc-500 py-10"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-purple-500"></i><br>Conectando ao servidor...</div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
