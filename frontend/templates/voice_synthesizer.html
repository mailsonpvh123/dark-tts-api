{% extends "base.html" %}

{% block content %}
<section id="aba_voice" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-purple-500/10 flex items-center justify-center border border-purple-500/20">
                <i class="fa-solid fa-microphone-lines text-purple-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Estúdio de Dublagem Neural</h1>
        </div>
        <p class="text-zinc-400">Sintetize vozes de alta conversão para os seus canais do YouTube.</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-purple-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                
                <div class="flex justify-between items-center mb-3 relative z-10">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-align-left text-purple-500"></i> Texto para Locução
                    </h2>
                    <span id="contador_caracteres_voz" class="text-xs font-bold text-zinc-500 bg-zinc-800/50 px-2 py-1 rounded border border-zinc-700 transition-colors">0 caracteres</span>
                </div>
                
                <textarea id="texto_voz" oninput="recalcularCustoVoz()" class="w-full h-64 bg-[#09090b] border border-zinc-700/80 rounded-xl p-5 text-zinc-200 focus:outline-none focus:border-purple-500 transition-colors resize-none shadow-inner text-lg leading-relaxed custom-scrollbar relative z-10" placeholder="Cole aqui o seu roteiro longo..."></textarea>
                
                <div id="info_tier" class="mt-6 relative z-10 transition-opacity">
                    </div>

                <div id="controles_standard" class="grid grid-cols-2 gap-6 mt-6 relative z-10 transition-opacity">
                    <div class="bg-[#09090b] p-4 rounded-xl border border-zinc-800 shadow-inner">
                        <div class="flex justify-between mb-2">
                            <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Velocidade</label>
                            <span id="val_v" class="text-xs font-bold text-purple-400">1.0x</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="ajustarVelocidade(-0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-purple-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-minus text-xs"></i></button>
                            <input type="range" id="velocidade" min="0.5" max="2.0" step="0.1" value="1.0" class="flex-1">
                            <button onclick="ajustarVelocidade(0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-purple-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                    
                    <div class="bg-[#09090b] p-4 rounded-xl border border-zinc-800 shadow-inner">
                        <div class="flex justify-between mb-2">
                            <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider">Tom (Pitch)</label>
                            <span id="val_p" class="text-xs font-bold text-purple-400">0Hz</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="ajustarPitch(-5)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-purple-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-minus text-xs"></i></button>
                            <input type="range" id="pitch" min="-50" max="50" step="5" value="0" class="flex-1">
                            <button onclick="ajustarPitch(5)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-purple-600 text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                </div>

                <button id="btn_gerar_voz" onclick="gerarAudioCompleto()" class="w-full mt-6 bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.3)] transition-all flex items-center justify-center gap-2 group border border-purple-500/50 relative z-10">
                    <i class="fa-solid fa-wand-magic-sparkles group-hover:scale-110 transition-transform"></i> <span id="txt_btn_voz">Sintetizar Standard (30 Coins)</span>
                </button>
                
                <div id="player_container" class="mt-6 hidden bg-emerald-500/5 p-5 rounded-xl border border-emerald-500/20 shadow-inner relative z-10"></div>
            </div>
        </div>
        
        <div class="space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-4 shadow-2xl h-full flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-purple-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                
                <h2 class="text-base font-semibold text-white flex items-center gap-2 mb-4 px-2 relative z-10"><i class="fa-solid fa-users text-purple-500"></i> Elenco de Vozes</h2>
                
                <div class="flex bg-[#09090b] p-1 rounded-lg mb-4 border border-zinc-800 shadow-inner relative z-10">
                    <button onclick="alternarAbaVozes('padrao')" id="aba_btn_padrao" class="flex-1 py-2 text-xs font-bold rounded-md bg-zinc-800 text-white shadow-sm transition-all">
                        Standard
                    </button>
                    <button onclick="alternarAbaVozes('creator')" id="aba_btn_creator" class="flex-1 py-2 text-xs font-bold rounded-md text-zinc-500 hover:text-white transition-all">
                        Creator
                    </button>
                    <button onclick="alternarAbaVozes('cinematic')" id="aba_btn_cinematic" class="flex-1 py-2 text-xs font-bold rounded-md text-zinc-500 hover:text-white transition-all">
                        <i class="fa-solid fa-star text-amber-500 mr-1"></i> Cinematic
                    </button>
                </div>

                <div id="lista_vozes" class="flex-1 max-h-[500px] overflow-y-auto space-y-3 pr-2 custom-scrollbar relative z-10">
                    <div class="flex items-center justify-center h-full text-zinc-500 text-sm">
                        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Carregando estúdio...
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
