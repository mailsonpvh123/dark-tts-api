{% extends "base.html" %}

{% block content %}
<section id="aba_voice" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-4 mb-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-fuchsia-600 flex items-center justify-center border border-purple-400/50 shadow-[0_0_20px_rgba(168,85,247,0.5)]">
                <i class="fa-solid fa-microphone-lines text-white text-xl"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-white tracking-tighter italic">ESTÚDIO <span class="text-purple-400">NEURAL</span></h1>
        </div>
        <p class="text-zinc-400 text-sm max-w-2xl leading-relaxed">Sintetize vozes hiper-realistas de alta conversão e garanta que o seu público não pisca até o fim do vídeo.</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#121214] border border-zinc-800/80 rounded-2xl p-6 shadow-2xl relative overflow-hidden group hover:border-purple-500/30 transition-colors">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-purple-500/20 rounded-full blur-[80px] pointer-events-none group-hover:bg-purple-500/30 transition-colors"></div>
                
                <div class="flex justify-between items-center mb-5 relative z-10 border-b border-zinc-800/80 pb-4">
                    <h2 class="text-base font-black text-white flex items-center gap-2 tracking-tight">
                        <i class="fa-solid fa-file-audio text-purple-500 mr-1"></i> Roteiro para Locução
                    </h2>
                    <span id="contador_caracteres_voz" class="text-[10px] font-mono text-purple-400 bg-purple-500/10 px-3 py-1.5 rounded border border-purple-500/20 shadow-inner">0 caracteres</span>
                </div>

                <div class="relative z-10">
                    <textarea id="texto_voz" oninput="recalcularCustoVoz()" class="w-full h-[220px] bg-[#09090b] border border-zinc-700/80 rounded-xl px-5 py-4 text-zinc-200 focus:border-purple-500 focus:ring-1 focus:ring-purple-500/50 outline-none transition-all shadow-inner resize-none text-sm leading-relaxed custom-scrollbar" placeholder="Cole aqui o seu roteiro blindado final para iniciar a gravação..."></textarea>
                </div>

                <div id="controles_standard" class="mt-6 p-5 bg-[#09090b] rounded-xl border border-zinc-800 shadow-inner relative z-10">
                    <h3 class="text-[10px] font-bold text-purple-400 uppercase tracking-widest mb-4 flex items-center gap-2"><i class="fa-solid fa-sliders"></i> Ajustes Standard (Edge TTS)</h3>
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <label class="flex justify-between text-[10px] font-bold text-zinc-400 uppercase mb-2">Velocidade <span id="val_v" class="text-white font-mono bg-zinc-800 px-2 rounded">1.0x</span></label>
                            <div class="flex items-center gap-2">
                                <button onclick="ajustarVelocidade(-0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white hover:bg-purple-600 transition-colors border border-zinc-700"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="range" id="velocidade" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full accent-purple-500" oninput="document.getElementById('val_v').innerText = this.value + 'x'">
                                <button onclick="ajustarVelocidade(0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white hover:bg-purple-600 transition-colors border border-zinc-700"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                        </div>
                        <div>
                            <label class="flex justify-between text-[10px] font-bold text-zinc-400 uppercase mb-2">Tom (Pitch) <span id="val_p" class="text-white font-mono bg-zinc-800 px-2 rounded">0Hz</span></label>
                            <div class="flex items-center gap-2">
                                <button onclick="ajustarPitch(-5)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white hover:bg-purple-600 transition-colors border border-zinc-700"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="range" id="pitch" min="-50" max="50" step="5" value="0" class="w-full accent-purple-500" oninput="document.getElementById('val_p').innerText = this.value + 'Hz'">
                                <button onclick="ajustarPitch(5)" class="w-8 h-8 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white hover:bg-purple-600 transition-colors border border-zinc-700"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="player_container" class="mt-6 p-5 bg-[#09090b] rounded-xl border border-emerald-500/30 hidden shadow-[0_0_15px_rgba(16,185,129,0.1)] relative z-10 transition-all duration-500">
                </div>

                <button id="btn_gerar_voz" onclick="gerarAudioCompleto()" class="w-full mt-6 bg-purple-600 hover:bg-purple-500 text-white font-black py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(147,51,234,0.4)] transition-all flex items-center justify-center gap-2 group border border-purple-500/50 relative z-10">
                    <i class="fa-solid fa-bolt group-hover:scale-110 transition-transform"></i> <span id="txt_btn_voz">Sintetizar Standard (30 Coins)</span>
                </button>
            </div>
        </div>
        
        <div class="lg:col-span-1">
            <div class="bg-[#121214] border border-zinc-800/80 rounded-2xl p-5 shadow-2xl flex flex-col h-[650px] relative overflow-hidden group hover:border-purple-500/20 transition-colors">
                <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-purple-500/10 rounded-full blur-[100px] pointer-events-none group-hover:bg-purple-500/20 transition-colors"></div>
                
                <h2 class="text-base font-black text-white border-b border-zinc-800/80 pb-4 mb-4 relative z-10 tracking-tight"><i class="fa-solid fa-users text-purple-500 mr-1"></i> Elenco Neural</h2>
                
                <div class="flex bg-[#09090b] p-1.5 rounded-xl mb-5 border border-zinc-800 shadow-inner relative z-10">
                    <button onclick="alternarAbaVozes('padrao')" id="aba_btn_padrao" class="flex-1 py-2 text-xs font-bold rounded-lg bg-zinc-800 text-white shadow-sm transition-all border border-zinc-700/50">
                        Standard
                    </button>
                    <button onclick="alternarAbaVozes('creator')" id="aba_btn_creator" class="flex-1 py-2 text-xs font-bold rounded-lg text-zinc-500 hover:text-white transition-all">
                        Creator
                    </button>
                    <button onclick="alternarAbaVozes('cinematic')" id="aba_btn_cinematic" class="flex-1 py-2 text-xs font-bold rounded-lg text-zinc-500 hover:text-white transition-all">
                        <i class="fa-solid fa-star text-amber-500 mr-1"></i> Cinematic
                    </button>
                </div>

                <div id="lista_vozes" class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar relative z-10">
                    <div class="flex items-center justify-center h-full text-zinc-500 text-sm font-bold">
                        <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Carregando...
                    </div>
                </div>

                <div id="info_tier" class="mt-4 relative z-10">
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
