{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-[#121214] p-8 rounded-2xl border border-zinc-800 w-full max-w-md shadow-2xl relative">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white italic">DARK<span class="text-zinc-500 font-normal">CREATOR</span></h1>
            <p class="text-zinc-500 text-xs mt-2">ÁREA DE ACESSO</p>
        </div>

        <form id="formLogin" class="space-y-5">
            <input type="email" id="email" required class="w-full p-3 bg-[#09090b] border border-zinc-800 rounded-lg text-white" placeholder="E-mail">
            <input type="password" id="password" required class="w-full p-3 bg-[#09090b] border border-zinc-800 rounded-lg text-white" placeholder="Senha">
            <button type="submit" id="btn_entrar" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3 rounded-lg transition-all">Entrar</button>
        </form>

        <div id="login_status" class="mt-4 text-center hidden p-3 rounded-lg text-xs font-bold border"></div>

        <div class="mt-6 text-center">
            <p class="text-zinc-500 text-sm">Novo por aqui? 
                <a href="/registrar" class="text-purple-400 hover:text-purple-300 font-bold transition-colors">Crie sua conta e ganhe 30 coins</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
