{% extends "base.html" %}

{% block content %}
<section id="aba_ideias" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-yellow-500/10 flex items-center justify-center border border-yellow-500/20">
                <i class="fa-solid fa-lightbulb text-yellow-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Gen Insights</h1>
        </div>
        <p class="text-zinc-400">Descubra temas inexplorados e tendências para o seu próximo vídeo viral.</p>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-yellow-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 relative z-10">
                    <i class="fa-solid fa-sliders text-yellow-500"></i> Parâmetros
                </h2>
                
                <div class="space-y-4 relative z-10">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Nicho ou Tema Principal <span class="text-yellow-500">*</span></label>
                        <input type="text" id="ideia_tema" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-yellow-500 transition-colors shadow-inner" placeholder="Ex: Filosofia Estoica, Terror Real...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Público-Alvo</label>
                        <input type="text" id="ideia_publico" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-yellow-500 transition-colors shadow-inner" placeholder="Ex: Jovens adultos, Empreendedores...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Tom do Conteúdo</label>
                        <select id="ideia_tom" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg pl-4 py-2.5 text-zinc-200 focus:outline-none focus:border-yellow-500 transition-colors appearance-none shadow-inner cursor-pointer">
                            <option value="Sombrio e Misterioso">Sombrio e Misterioso</option>
                            <option value="Curiosidade Intrigante">Curiosidade Intrigante</option>
                            <option value="Informativo e Direto">Informativo e Direto</option>
                        </select>
                    </div>
                </div>
                
                <button id="btn_gerar_ideias" onclick="chamarGeradorIdeias()" class="w-full mt-6 bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(202,138,4,0.3)] transition-all flex items-center justify-center gap-2 group border border-yellow-500/50 relative z-10">
                    <i class="fa-solid fa-map-location-dot group-hover:scale-110 transition-transform"></i> Mapear Ideias
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl h-full flex flex-col min-h-[400px] relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-yellow-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-lg font-semibold text-white flex items-center gap-2 border-b border-zinc-800/80 pb-4 mb-4 relative z-10">
                    <i class="fa-solid fa-bolt text-yellow-500"></i> Ideias Mineradas
                </h2>
                
                <div id="container_ideias" class="flex-1 flex flex-col items-center justify-center text-center relative z-10">
                    <div class="w-16 h-16 rounded-full bg-[#121214] border border-zinc-800 flex items-center justify-center mb-4 shadow-inner">
                        <i class="fa-solid fa-brain text-xl text-zinc-600"></i>
                    </div>
                    <h3 class="text-sm font-bold text-zinc-500">A tela está em branco</h3>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    let ideiasGlobais = [];

    async function chamarGeradorIdeias() {
        const btn = document.getElementById('btn_gerar_ideias');
        const container = document.getElementById('container_ideias');
        const tema = document.getElementById('ideia_tema').value;
        const publico = document.getElementById('ideia_publico').value || "Geral";
        const tom = document.getElementById('ideia_tom').value;

        if(!tema) return alert("Por favor, preencha o Nicho ou Tema."); 

        // Estado de Loading
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;
        container.innerHTML = `<div class="flex flex-col items-center justify-center py-10 w-full h-full relative z-10"><i class="fa-solid fa-brain fa-fade text-4xl text-yellow-500 mb-4"></i><p class="text-zinc-400 text-sm animate-pulse">A IA Groq está analisando tendências e elaborando roteiros magnéticos...</p></div>`;

        try {
            // Chamada nativa para a nossa API construída no FastAPI
            const res = await fetch("/api/v1/gen-insights", { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ tema, publico, tom }) 
            });
            
            if(!res.ok) {
                let erroReal = "Erro desconhecido do servidor.";
                try { const dadosErro = await res.json(); erroReal = dadosErro.detail || erroReal; } catch(e) {}
                throw new Error(erroReal);
            }

            // Lê o JSON direto do Python
            const dadosLimpos = await res.json();
            ideiasGlobais = dadosLimpos.ideias; 
            
            // Limpa o container e prepara a lista
            container.innerHTML = '<div class="w-full text-left space-y-4 relative z-10" id="lista_ideias_geradas"></div>';
            const listaDiv = document.getElementById('lista_ideias_geradas');

            // Renderiza os Cards
            ideiasGlobais.forEach((ideia, index) => {
                listaDiv.innerHTML += `
                    <div class="bg-[#121214] border border-yellow-500/30 rounded-xl p-5 hover:border-yellow-500/60 transition-colors shadow-inner">
                        <div class="flex items-center justify-between mb-3 border-b border-zinc-800 pb-2">
                            <span class="bg-yellow-500/20 text-yellow-400 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Ideia ${index + 1}</span>
                            <button onclick="copiarParaScriptForge(${index}, this)" class="text-orange-400 hover:text-white transition-colors text-xs font-bold uppercase tracking-wider flex items-center gap-2 bg-orange-500/10 px-3 py-1.5 rounded-lg border border-orange-500/20 hover:bg-orange-600"><i class="fa-solid fa-copy"></i> Copiar P/ Script</button>
                        </div>
                        <h3 class="text-white font-bold text-lg mb-2 group-hover:text-yellow-300 transition-colors">${ideia.titulo}</h3>
                        <p class="text-sm text-zinc-300 mb-2 border-l-2 border-yellow-500/50 pl-3"><strong class="text-yellow-500/80">Gancho:</strong> ${ideia.gancho}</p>
                        <p class="text-sm text-zinc-400 leading-relaxed"><strong class="text-yellow-500/80">Visão Geral:</strong> ${ideia.resumo}</p>
                    </div>`;
            });
        } catch (error) { 
            container.innerHTML = `<p class="text-red-400 font-bold p-5 relative z-10"><i class="fa-solid fa-triangle-exclamation"></i> Erro Técnico: ${error.message}</p>`; 
        } finally { 
            btn.classList.remove('opacity-70', 'cursor-not-allowed'); 
            btn.innerHTML = `<i class="fa-solid fa-map-location-dot group-hover:scale-110 transition-transform"></i> Mapear Ideias`;
        }
    }

    // Função ajustada para arquitetura de Páginas Separadas (MPA)
    function copiarParaScriptForge(index, btnElement) {
        const ideia = ideiasGlobais[index];
        const textoMontado = `TÍTULO: ${ideia.titulo}\nGANCHO: ${ideia.gancho}\nRESUMO: ${ideia.resumo}`;
        
        // Copia para a área de transferência
        navigator.clipboard.writeText(textoMontado).then(() => {
            const txtOriginal = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-check"></i> Copiado!`;
            btnElement.classList.replace('text-orange-400', 'text-emerald-400');
            setTimeout(() => {
                btnElement.innerHTML = txtOriginal;
                btnElement.classList.replace('text-emerald-400', 'text-orange-400');
            }, 2000);
        });
    }
</script>
{% endblock %}
