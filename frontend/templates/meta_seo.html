{% extends "base.html" %}

{% block content %}
<section id="aba_seo" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center border border-blue-500/20"><i class="fa-solid fa-magnifying-glass-chart text-blue-400 text-lg"></i></div><h1 class="text-2xl md:text-3xl font-bold text-white">Meta & SEO</h1></div>
        <p class="text-zinc-400">Gere títulos, descrições e tags otimizadas para o algoritmo com a velocidade do Groq.</p>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2 relative z-10 border-b border-zinc-800/80 pb-2"><i class="fa-solid fa-file-code text-blue-500"></i> Contexto do Vídeo</h2>
                <div class="relative z-10 flex-1 flex flex-col space-y-4">
                    <div class="flex-1 flex flex-col"><label class="block text-[10px] font-medium text-zinc-400 mb-1">Roteiro / Conteúdo Base</label><textarea id="seo_conteudo" oninput="salvarEstado('seo_conteudo')" class="w-full flex-1 bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-3 text-zinc-200 min-h-[140px] focus:border-blue-500 focus:outline-none transition-colors shadow-inner resize-none custom-scrollbar" placeholder="Cole aqui o roteiro..."></textarea></div>
                    <div><label class="block text-[10px] font-medium text-zinc-400 mb-1">Palavra-chave Opcional</label><input type="text" id="seo_keyword" oninput="salvarEstado('seo_keyword')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 text-sm focus:border-blue-500 focus:outline-none transition-colors shadow-inner" placeholder="Ex: Criptomoedas, Mistério..."></div>
                    <div><label class="block text-[10px] font-medium text-zinc-400 mb-1">Nome do Canal</label><input type="text" id="seo_canal" oninput="salvarEstado('seo_canal')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 text-sm focus:border-blue-500 focus:outline-none transition-colors shadow-inner" placeholder="Ex: Zork Imports"></div>
                </div>
                
                <div class="flex gap-3 mt-6 relative z-10">
                    <button id="btn_gerar_seo" onclick="chamarMetaSEO()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-lg shadow-[0_0_15px_rgba(59,130,246,0.4)] transition-all flex items-center justify-center gap-2 group border border-blue-500/50">
                        <i class="fa-solid fa-chart-line group-hover:scale-110 transition-transform"></i> <span id="txt_btn_seo">Gerar Meta & SEO</span>
                    </button>
                    <button onclick="limparSEO()" class="bg-zinc-800 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-500/50 font-bold py-3 px-4 rounded-lg transition-all flex items-center justify-center group" title="Limpar Tela">
                        <i class="fa-solid fa-trash-can group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2 relative z-10 border-b border-zinc-800/80 pb-2"><i class="fa-solid fa-rocket text-blue-500"></i> Arquitetura Otimizada</h2>
                
                <div class="relative flex-1 flex flex-col z-10">
                    <div id="loading_seo" class="hidden absolute inset-0 bg-[#121214]/90 backdrop-blur-sm rounded-lg flex flex-col items-center justify-center z-20 border border-blue-500/20">
                        <i class="fa-solid fa-bolt fa-fade text-4xl text-blue-500 mb-4 drop-shadow-[0_0_10px_rgba(59,130,246,0.6)]"></i>
                        <p class="text-zinc-300 text-sm font-bold animate-pulse">Groq está gerando as Tags...</p>
                    </div>
                    <textarea id="seo_resultado" oninput="salvarEstado('seo_resultado')" class="flex-1 w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-5 py-4 text-blue-400/90 font-mono text-sm leading-relaxed mb-5 focus:border-blue-500 focus:outline-none transition-colors shadow-inner custom-scrollbar resize-none" placeholder="O resultado aparecerá aqui..."></textarea>
                </div>
                
                <button onclick="baixarTXTSEO()" class="w-full bg-[#121214] hover:bg-blue-600 text-blue-400 hover:text-white font-bold py-3.5 rounded-lg border border-blue-500/30 transition-colors flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(59,130,246,0.1)] relative z-10 group">
                    <i class="fa-solid fa-download group-hover:scale-110 transition-transform"></i> Baixar Meta & SEO (.TXT)
                </button>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const campos = ['seo_conteudo', 'seo_keyword', 'seo_canal', 'seo_resultado'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if(el && sessionStorage.getItem(id)) el.value = sessionStorage.getItem(id);
        });
    });

    function salvarEstado(id) { sessionStorage.setItem(id, document.getElementById(id).value); }

    function limparSEO() {
        const campos = ['seo_conteudo', 'seo_keyword', 'seo_canal', 'seo_resultado'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if(el) { el.value = ''; sessionStorage.removeItem(id); }
        });
    }

    async function chamarMetaSEO() {
        const btn = document.getElementById('btn_gerar_seo');
        const txtBtn = document.getElementById('txt_btn_seo');
        const overlay = document.getElementById('loading_seo');
        
        const conteudo = document.getElementById('seo_conteudo').value;
        const keyword = document.getElementById('seo_keyword').value || "Geral";
        const canal = document.getElementById('seo_canal').value || "Meu Canal";

        if(!conteudo.trim()) return alert("Por favor, cole um Roteiro para a IA analisar.");

        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        txtBtn.innerHTML = `Lendo... <i class="fa-solid fa-circle-notch fa-spin ml-1"></i>`;
        overlay.classList.remove('hidden');

        try {
            const res = await fetch("/api/v1/meta-seo", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ conteudo, keyword, canal })
            });
            
            if(!res.ok) {
                let err = "Erro"; try{ const d = await res.json(); err = d.detail; }catch(e){} throw new Error(err);
            }
            
            const dados = await res.json();
            document.getElementById('seo_resultado').value = dados.seo_result;
            salvarEstado('seo_resultado');
        } catch (error) { 
            document.getElementById('seo_resultado').value = "Erro Técnico: " + error.message; 
        } finally { 
            overlay.classList.add('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed'); 
            txtBtn.innerText = "Gerar Meta & SEO";
        }
    }

    function baixarTXTSEO() {
        const texto = document.getElementById('seo_resultado').value;
        if(!texto) return alert("Gere o SEO primeiro!"); 
        const blob = new Blob([texto], { type: 'text/plain' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
        link.download = `SEO_${new Date().getTime()}.txt`;
        link.click();
    }
</script>
{% endblock %}
