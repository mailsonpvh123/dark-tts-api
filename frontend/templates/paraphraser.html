{% extends "base.html" %}

{% block content %}
<section id="aba_paraphraser" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-pink-500/10 flex items-center justify-center border border-pink-500/20">
                <i class="fa-solid fa-rotate text-pink-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Text Transmuter</h1>
        </div>
        <p class="text-zinc-400">Reescreva textos blindando contra plágio e mantendo a retenção em alta.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden flex flex-col h-full">
            <div class="absolute -top-20 -left-20 w-40 h-40 bg-pink-500/10 rounded-full blur-[60px] pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-4 relative z-10">
                <h2 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="fa-regular fa-file-lines text-pink-500"></i> Texto Original
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="document.getElementById('arquivo_txt').click()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg text-xs font-bold border border-zinc-700 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-file-import"></i> Carregar .TXT
                    </button>
                    <input type="file" id="arquivo_txt" accept=".txt" class="hidden" onchange="lerArquivoTxt(event)">
                    <span id="contador_original" class="text-xs font-bold text-zinc-500 bg-zinc-800/50 px-2 py-1 rounded border border-zinc-700">0 palavras</span>
                </div>
            </div>
            
            <textarea id="texto_original" oninput="document.getElementById('contador_original').innerText = contarPalavrasLocal(this.value) + ' palavras'; atualizarCustoParaphraser();" class="w-full flex-1 min-h-[250px] bg-[#09090b] border border-zinc-700/80 rounded-xl p-4 text-zinc-200 focus:outline-none focus:border-pink-500 transition-all resize-none shadow-inner text-sm custom-scrollbar relative z-10" placeholder="Cole o roteiro, artigo ou arraste e solte um arquivo .TXT aqui..."></textarea>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 relative z-10">
                <div>
                    <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block mb-2">Estratégia (Modo)</label>
                    <select id="estrategia_escrita" class="w-full bg-[#09090b] border border-zinc-700 rounded-lg p-3 text-zinc-200 focus:outline-none focus:border-pink-500 text-sm appearance-none">
                        <option value="padrao">Roteiro Padrão</option>
                        <option value="reddit">Modo Reddit (Adaptação)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block mb-2">Nome do Canal</label>
                    <input type="text" id="nome_canal" class="w-full bg-[#09090b] border border-zinc-700 rounded-lg p-3 text-zinc-200 focus:outline-none focus:border-pink-500 text-sm placeholder:text-zinc-600">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block mb-2">Gancho (Opcional)</label>
                    <input type="text" id="gancho_exato" class="w-full bg-[#09090b] border border-zinc-700 rounded-lg p-3 text-zinc-200 focus:outline-none focus:border-pink-500 text-sm placeholder:text-zinc-600" placeholder="Título exato da imagem...">
                </div>
            </div>

            <div class="flex items-center gap-3 mt-6 relative z-10">
                <button id="btn_transmutar" onclick="transmutarTexto()" class="w-full flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(236,72,153,0.3)] transition-all flex items-center justify-center gap-2 group border border-pink-500/50">
                    <i class="fa-solid fa-wand-magic-sparkles group-hover:scale-110 transition-transform"></i> <span id="txt_btn_transmutar">Transmutar Texto (1 Coins)</span>
                </button>
                <button onclick="limparParaphraser()" class="w-14 h-14 shrink-0 bg-[#09090b] hover:bg-red-500/20 text-zinc-500 hover:text-red-400 font-bold rounded-xl border border-zinc-700 hover:border-red-500/50 transition-all flex items-center justify-center shadow-inner" title="Limpar Textos e Cache">
                    <i class="fa-regular fa-trash-can text-lg"></i>
                </button>
            </div>
        </div>

        <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden flex flex-col h-full">
            <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-pink-500/5 rounded-full blur-[60px] pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-4 relative z-10">
                <h2 class="text-base font-semibold text-white flex items-center gap-2">
                    <i class="fa-solid fa-file-signature text-pink-500"></i> Texto Transmutado
                </h2>
                <div class="flex items-center gap-2">
                    <span id="contador_resultado" class="text-xs font-bold text-zinc-500 bg-zinc-800/50 px-2 py-1 rounded border border-zinc-700">0 palavras</span>
                    <button onclick="copiarTextoTransmutado()" class="bg-zinc-800 hover:bg-emerald-600 text-zinc-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-zinc-700 transition-colors flex items-center gap-2" title="Copiar Roteiro">
                        <i id="icone_copiar" class="fa-regular fa-copy"></i>
                    </button>
                    <button onclick="despacharParaVoice('texto_transmutado')" class="bg-purple-600/20 hover:bg-purple-600 text-purple-400 hover:text-white border border-purple-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-share-nodes"></i> ENVIAR P/ VOICE
                    </button>
                </div>
            </div>
            
            <textarea id="texto_transmutado" class="w-full flex-1 min-h-[350px] bg-[#09090b] border border-zinc-700/80 rounded-xl p-4 text-zinc-200 focus:outline-none focus:border-pink-500 transition-colors resize-none shadow-inner text-sm leading-relaxed custom-scrollbar relative z-10" placeholder="Seu roteiro blindado e altamente retentivo aparecerá aqui..."></textarea>
        </div>
    </div>
</section>

<script>
    // JS Mágico de Cálculo de Coins (1 por 2000 chars)
    function atualizarCustoParaphraser() {
        const chars = document.getElementById('texto_original').value.length;
        const custo = Math.max(1, Math.ceil(chars / 2000));
        document.getElementById('txt_btn_transmutar').innerText = `Transmutar Texto (${custo} Coins)`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        const txtOriginal = document.getElementById('texto_original');
        const txtResultado = document.getElementById('texto_transmutado');
        const canal = document.getElementById('nome_canal');
        const gancho = document.getElementById('gancho_exato');
        const estrategia = document.getElementById('estrategia_escrita');

        const textoDoMiner = localStorage.getItem('texto_pendente_paraphraser');
        
        if (textoDoMiner) {
            txtOriginal.value = textoDoMiner;
            localStorage.setItem('paraph_original', textoDoMiner); 
            localStorage.removeItem('texto_pendente_paraphraser'); 
        } 
        else if(localStorage.getItem('paraph_original')) {
            txtOriginal.value = localStorage.getItem('paraph_original');
        }

        if(txtOriginal.value && typeof contarPalavrasLocal === 'function') {
            document.getElementById('contador_original').innerText = contarPalavrasLocal(txtOriginal.value) + ' palavras';
        }

        if(localStorage.getItem('paraph_resultado')) {
            txtResultado.value = localStorage.getItem('paraph_resultado');
            if(typeof contarPalavrasLocal === 'function') {
                document.getElementById('contador_resultado').innerText = contarPalavrasLocal(txtResultado.value) + ' palavras';
            }
        }
        if(localStorage.getItem('paraph_canal')) canal.value = localStorage.getItem('paraph_canal');
        if(localStorage.getItem('paraph_gancho')) gancho.value = localStorage.getItem('paraph_gancho');
        if(localStorage.getItem('paraph_estrategia')) estrategia.value = localStorage.getItem('paraph_estrategia');

        atualizarCustoParaphraser();

        txtOriginal.addEventListener('input', () => { 
            localStorage.setItem('paraph_original', txtOriginal.value);
            atualizarCustoParaphraser();
        });
        txtResultado.addEventListener('input', () => localStorage.setItem('paraph_resultado', txtResultado.value));
        canal.addEventListener('input', () => localStorage.setItem('paraph_canal', canal.value));
        gancho.addEventListener('input', () => localStorage.setItem('paraph_gancho', gancho.value));
        estrategia.addEventListener('change', () => localStorage.setItem('paraph_estrategia', estrategia.value));
    });

    function limparParaphraser() {
        if(confirm("Deseja apagar os textos e esvaziar a área de trabalho?")) {
            document.getElementById('texto_original').value = '';
            document.getElementById('texto_transmutado').value = '';
            document.getElementById('gancho_exato').value = '';
            
            document.getElementById('contador_original').innerText = '0 palavras';
            document.getElementById('contador_resultado').innerText = '0 palavras';
            
            localStorage.removeItem('paraph_original');
            localStorage.removeItem('paraph_resultado');
            localStorage.removeItem('paraph_gancho');
            
            atualizarCustoParaphraser();
        }
    }

    function copiarTextoTransmutado() {
        const texto = document.getElementById('texto_transmutado').value;
        if(!texto) return;
        navigator.clipboard.writeText(texto).then(() => {
            const icone = document.getElementById('icone_copiar');
            icone.className = "fa-solid fa-check text-emerald-400";
            setTimeout(() => { icone.className = "fa-regular fa-copy text-zinc-300"; }, 2000);
        });
    }

    function lerArquivoTxt(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const textarea = document.getElementById('texto_original');
            textarea.value = e.target.result;
            if(typeof contarPalavrasLocal === 'function') {
                document.getElementById('contador_original').innerText = contarPalavrasLocal(e.target.result) + ' palavras';
            }
            localStorage.setItem('paraph_original', e.target.result);
            atualizarCustoParaphraser();
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    const dropZone = document.getElementById('texto_original');
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-pink-500', 'bg-pink-500/5');
    });
    
    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-pink-500', 'bg-pink-500/5');
    });
    
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-pink-500', 'bg-pink-500/5');
        
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.name.toLowerCase().endsWith('.txt')) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    dropZone.value = ev.target.result;
                    if(typeof contarPalavrasLocal === 'function') {
                        document.getElementById('contador_original').innerText = contarPalavrasLocal(ev.target.result) + ' palavras';
                    }
                    localStorage.setItem('paraph_original', ev.target.result);
                    atualizarCustoParaphraser();
                };
                reader.readAsText(file);
            } else {
                alert('Apenas arquivos no formato .TXT são aceitos para extração rápida de texto.');
            }
        }
    });
</script>
{% endblock %}
