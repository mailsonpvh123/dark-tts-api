{% extends "base.html" %}

{% block content %}
<section id="aba_thumb" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-pink-500/10 flex items-center justify-center border border-pink-500/20"><i class="fa-solid fa-image text-pink-400 text-lg"></i></div><h1 class="text-2xl md:text-3xl font-bold text-white">Thumb Maker Pro</h1></div>
        <p class="text-zinc-400">Cole o roteiro completo. O Diretor IA vai gerar os prompts gringos focados em cliques.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="xl:col-span-1 space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-pink-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 relative z-10 border-b border-zinc-800/80 pb-2"><i class="fa-solid fa-clapperboard text-pink-500"></i> Sobre o Vídeo</h2>
                <div class="space-y-4 relative z-10">
                    <div><label class="block text-sm font-medium text-zinc-400 mb-1.5">Título da História <span class="text-pink-500">*</span></label><input type="text" id="thumb_titulo" oninput="salvarEstado('thumb_titulo')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="Ex: O Mistério da Casa..."></div>
                    <div><label class="block text-sm font-medium text-zinc-400 mb-1.5">Roteiro Completo <span class="text-pink-500">*</span></label><textarea id="thumb_roteiro" oninput="salvarEstado('thumb_roteiro')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-3 text-zinc-200 focus:outline-none focus:border-pink-500 transition-colors shadow-inner resize-none min-h-[140px] text-xs custom-scrollbar" placeholder="Cole o roteiro aqui..."></textarea></div>
                    
                    <div class="bg-[#121214] p-4 rounded-lg border border-zinc-800/80 shadow-inner">
                        <label class="block text-sm font-bold text-pink-400 mb-2">Texto na Arte (Overlay)</label>
                        <input type="text" id="thumb_texto_arte" oninput="salvarEstado('thumb_texto_arte')" class="w-full bg-[#09090b] border border-pink-500/30 rounded-lg px-4 py-2 text-white font-black text-center tracking-widest focus:border-pink-500 outline-none mb-3" placeholder="Ex: NÃO OLHE!">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase">Cor do Texto</label>
                                <input type="text" id="thumb_cor_texto" oninput="salvarEstado('thumb_cor_texto')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded px-3 py-1.5 text-zinc-300 text-xs focus:outline-none focus:border-pink-500 transition-colors shadow-inner" placeholder="Ex: Amarelo Neon, Branco... ">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-zinc-500 mb-1 uppercase">Posição</label>
                                <select id="thumb_posicao_texto" onchange="salvarEstado('thumb_posicao_texto')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded px-2 py-1.5 text-zinc-300 text-xs focus:outline-none focus:border-pink-500 transition-colors">
                                    <option value="Topo Centralizado">Topo Centralizado</option>
                                    <option value="Canto Superior Esquerdo">Canto Superior Esquerdo</option>
                                    <option value="Esquerda Centralizado">Esquerda Centralizado</option>
                                    <option value="Centro Absoluto (Gigante)">Centro Absoluto (Gigante)</option>
                                    <option value="Direita Centralizado">Direita Centralizado</option>
                                    <option value="Rodapé Centralizado">Rodapé Centralizado</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Estilo Visual da Capa</label>
                        <select id="thumb_estilo" onchange="salvarEstado('thumb_estilo')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-pink-500 transition-colors appearance-none shadow-inner cursor-pointer">
                            <optgroup label="Realismo & Cinema" class="bg-[#121214] text-pink-400">
                                <option value="Fotorealismo Extremo (8k, Detalhado)" class="text-zinc-300">Fotorealismo Extremo (8k)</option>
                                <option value="Cinematográfico (Iluminação Dramática, Lente 35mm)" class="text-zinc-300">Cinematográfico Dramático</option>
                                <option value="Documentário Investigativo (Câmera de Segurança/Raw)" class="text-zinc-300">Estilo Câmera de Segurança/Raw</option>
                            </optgroup>
                            <optgroup label="Dark & Horror" class="bg-[#121214] text-pink-400">
                                <option value="Dark Fantasy (Sombrio, Gótico, Misterioso)" class="text-zinc-300">Dark Fantasy</option>
                                <option value="Horror Psicológico (Tenso, Desconfortável, Sombras)" class="text-zinc-300">Horror Psicológico</option>
                                <option value="Macabro e Assustador (Estilo Invocação do Mal)" class="text-zinc-300">Macabro (Filme de Terror)</option>
                            </optgroup>
                            <optgroup label="YouTube CTR Focus" class="bg-[#121214] text-pink-400">
                                <option value="Clickbait Agressivo (Cores vibrantes, Expressões Exageradas)" class="text-zinc-300">Clickbait Agressivo (YouTube)</option>
                                <option value="Mistério Intrigante (Silhuetas, Elementos Escondidos, Curiosidade)" class="text-zinc-300">Mistério Intrigante</option>
                            </optgroup>
                            <optgroup label="Artísticos & Estilizados" class="bg-[#121214] text-pink-400">
                                <option value="Animação 3D (Estilo Pixar/Disney Sombria)" class="text-zinc-300">Animação 3D (Pixar Sombria)</option>
                                <option value="Cyberpunk Neon (Futurista, Contrastes fortes)" class="text-zinc-300">Cyberpunk Neon</option>
                                <option value="Anime Estilo Dark (Alta Qualidade, Mappa Studio)" class="text-zinc-300">Anime Dark (High Quality)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-6 relative z-10">
                    <button id="btn_gerar_thumb" onclick="chamarThumbMaker()" class="flex-1 bg-pink-700 hover:bg-pink-600 text-white font-bold py-3.5 px-4 rounded-lg shadow-[0_0_15px_rgba(190,24,93,0.4)] transition-all flex items-center justify-center gap-2 group border border-pink-500/50">
                        <i class="fa-solid fa-palette group-hover:scale-110 transition-transform"></i> <span id="txt_btn_thumb">Gerar Prompts</span>
                    </button>
                    <button onclick="limparThumb()" class="bg-zinc-800 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-500/50 font-bold py-3 px-4 rounded-lg transition-all flex items-center justify-center group" title="Limpar Tela">
                        <i class="fa-solid fa-trash-can group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="xl:col-span-2 space-y-6 flex flex-col h-full">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden min-h-[500px]">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-pink-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800/80 relative z-10"><h2 class="text-base font-semibold text-white flex items-center gap-2"><i class="fa-solid fa-eye text-pink-500"></i> Caminhos Virais</h2></div>
                
                <div id="container_thumbs" class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-4 relative z-10">
                    <div class="flex flex-col items-center justify-center h-full text-center py-20">
                        <div class="w-16 h-16 rounded-full bg-[#121214] border border-zinc-800 flex items-center justify-center mb-4 shadow-inner"><i class="fa-solid fa-layer-group text-xl text-zinc-600"></i></div>
                        <h3 class="text-sm font-bold text-zinc-500">O Diretor de Arte aguarda o roteiro</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const campos = ['thumb_titulo', 'thumb_roteiro', 'thumb_texto_arte', 'thumb_estilo', 'thumb_cor_texto', 'thumb_posicao_texto'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if(el && sessionStorage.getItem(id)) el.value = sessionStorage.getItem(id);
        });

        if(sessionStorage.getItem('thumbHTML')) {
            document.getElementById('container_thumbs').innerHTML = sessionStorage.getItem('thumbHTML');
        }
    });

    function salvarEstado(id) { sessionStorage.setItem(id, document.getElementById(id).value); }

    function limparThumb() {
        const campos = ['thumb_titulo', 'thumb_roteiro', 'thumb_texto_arte', 'thumb_cor_texto', 'thumb_posicao_texto'];
        campos.forEach(id => { const el = document.getElementById(id); if(el){ el.value = ''; sessionStorage.removeItem(id); } });
        
        // Reseta apenas o select de posição. A cor agora é digitável e já foi limpa no loop acima!
        document.getElementById('thumb_posicao_texto').selectedIndex = 0;

        sessionStorage.removeItem('thumbHTML');
        document.getElementById('container_thumbs').innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center py-20"><div class="w-16 h-16 rounded-full bg-[#121214] border border-zinc-800 flex items-center justify-center mb-4 shadow-inner"><i class="fa-solid fa-layer-group text-xl text-zinc-600"></i></div><h3 class="text-sm font-bold text-zinc-500">O Diretor de Arte aguarda o roteiro</h3></div>`;
    }

    async function chamarThumbMaker() {
        const btn = document.getElementById('btn_gerar_thumb');
        const txtBtn = document.getElementById('txt_btn_thumb');
        const container = document.getElementById('container_thumbs');
        
        const titulo = document.getElementById('thumb_titulo').value;
        const roteiro = document.getElementById('thumb_roteiro').value;
        const estilo = document.getElementById('thumb_estilo').value;
        const texto_arte = document.getElementById('thumb_texto_arte').value || "SEM TEXTO";
        const cor_texto = document.getElementById('thumb_cor_texto').value || "Não especificado";
        const posicao_texto = document.getElementById('thumb_posicao_texto').value;

        if(!titulo || !roteiro) return alert("Preencha o Título e o Roteiro.");

        btn.disabled = true; btn.classList.add('opacity-70', 'cursor-not-allowed');
        txtBtn.innerHTML = `Criando Arte... <i class="fa-solid fa-circle-notch fa-spin ml-1"></i>`;
        container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-pink-500"><i class="fa-solid fa-palette fa-fade text-4xl mb-4"></i><p class="font-bold">Analisando a história...</p></div>`;

        try {
            const res = await fetch("/api/v1/thumb-maker", {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, roteiro, estilo, texto_arte, cor_texto, posicao_texto })
            });
            
            if(!res.ok) {
                let err = "Erro desconhecido."; try { const d = await res.json(); err = d.detail; } catch(e){}
                throw new Error(err);
            }
            
            const dados = await res.json();

            let htmlC = '';
            if(dados.conflito_principal) htmlC += `<div class="mb-5 p-4 bg-[#121214] rounded-lg border border-pink-500/30 shadow-inner"><h3 class="text-xs font-bold text-pink-400 mb-2 uppercase"><i class="fa-solid fa-anchor"></i> Conflito Principal (Âncora)</h3><p class="text-sm text-zinc-300 italic">"${dados.conflito_principal}"</p></div>`;
            
            if(dados.capas) {
                dados.capas.forEach((capa, i) => {
                    htmlC += `
                        <div class="bg-[#121214] border border-zinc-800/80 rounded-xl p-5 mb-4 shadow-inner hover:border-pink-500/30 transition-colors">
                            <span class="text-pink-400 text-[10px] font-bold uppercase mb-2 bg-pink-500/10 px-2 py-1 inline-block rounded border border-pink-500/20">Ideia ${i + 1}: ${capa.estrategia}</span>
                            <p class="text-xs text-zinc-400 mb-4 border-l-2 border-zinc-700 pl-3 italic">"${capa.psicologia}"</p>
                            <div class="flex items-center justify-between mb-1">
                                <span class="text-[10px] font-bold text-zinc-500"><i class="fa-solid fa-terminal text-emerald-500"></i> PROMPT GRINGO:</span>
                                <button onclick="copiarTexto('${btoa(unescape(encodeURIComponent(capa.prompt_gringo)))}', this)" class="text-pink-500 hover:text-white transition-colors text-xs flex items-center gap-1"><i class="fa-solid fa-copy"></i> Copiar</button>
                            </div>
                            <textarea class="w-full bg-[#09090b] border border-zinc-700/80 rounded px-3 py-2 text-emerald-400 text-xs font-mono resize-none h-24 shadow-inner focus:outline-none focus:border-pink-500" readonly>${capa.prompt_gringo}</textarea>
                        </div>`;
                });
            }
            container.innerHTML = htmlC;
            sessionStorage.setItem('thumbHTML', htmlC);
        } catch (error) {
            container.innerHTML = `<p class="text-red-400 text-center font-bold py-10"><i class="fa-solid fa-triangle-exclamation"></i> Erro: ${error.message}</p>`;
        } finally {
            btn.disabled = false; btn.classList.remove('opacity-70', 'cursor-not-allowed'); txtBtn.innerHTML = "Gerar Prompts";
        }
    }

    function copiarTexto(base64Str, btnElement) {
        const texto = decodeURIComponent(escape(atob(base64Str)));
        navigator.clipboard.writeText(texto).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-check"></i> Copiado!`;
            btnElement.classList.replace('text-pink-500', 'text-emerald-400');
            setTimeout(() => {
                btnElement.innerHTML = originalText;
                btnElement.classList.replace('text-emerald-400', 'text-pink-500');
            }, 2000);
        });
    }
</script>
{% endblock %}
