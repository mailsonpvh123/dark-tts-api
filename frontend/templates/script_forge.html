{% extends "base.html" %}

{% block content %}
<section id="aba_script" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-orange-500/10 flex items-center justify-center border border-orange-500/20">
                <i class="fa-solid fa-pen-nib text-orange-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Script Forge</h1>
        </div>
        <p class="text-zinc-400">Forje roteiros hipnóticos para reter a atenção do espectador a cada segundo.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-orange-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800/80 relative z-10">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2"><i class="fa-solid fa-clipboard-list text-orange-500"></i> A Ideia Base</h2>
                    <span id="contador_script_in" class="text-xs bg-orange-500/20 text-orange-400 px-2.5 py-1 rounded-full font-bold border border-orange-500/30 shadow-inner">0 palavras</span>
                </div>
                
                <textarea id="script_ideia_base" oninput="contarPalavrasLocal('script_ideia_base', 'contador_script_in')" class="flex-1 w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-3 text-zinc-200 min-h-[120px] focus:border-orange-500 focus:outline-none transition-colors shadow-inner relative z-10" placeholder="Cole aqui o título, o gancho e o resumo da ideia..."></textarea>
                
                <div class="grid grid-cols-2 gap-3 mt-5 relative z-10">
                    <div>
                        <label class="block text-[10px] font-medium text-zinc-400 mb-1">Nome do Canal</label>
                        <input type="text" id="script_canal" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-3 py-2 text-zinc-200 text-sm focus:border-orange-500 focus:outline-none transition-colors shadow-inner" placeholder="Ex: Oculto no Mundo">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-zinc-400 mb-1">Formato</label>
                        <select id="script_formato" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-3 py-2 text-zinc-200 text-sm focus:border-orange-500 focus:outline-none transition-colors shadow-inner cursor-pointer">
                            <option value="Vídeo Horizontal">Horizontal (16:9)</option>
                            <option value="Vídeo Vertical">Vertical (9:16)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-zinc-400 mb-1">Tamanho Esperado</label>
                        <input type="text" id="script_tamanho" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-3 py-2 text-zinc-200 text-sm focus:border-orange-500 focus:outline-none transition-colors shadow-inner" placeholder="Ex: 1500 palavras">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-zinc-400 mb-1">Instruções Extras</label>
                        <input type="text" id="script_instrucoes" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-3 py-2 text-zinc-200 text-sm focus:border-orange-500 focus:outline-none transition-colors shadow-inner" placeholder="Ex: Seja irônico">
                    </div>
                </div>
                
                <button id="btn_gerar_script" onclick="chamarScriptForge()" class="w-full mt-6 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-lg shadow-[0_0_15px_rgba(249,115,22,0.4)] transition-all flex items-center justify-center gap-2 group border border-orange-500/50 relative z-10">
                    <i class="fa-solid fa-fire group-hover:scale-110 transition-transform"></i> <span id="txt_btn_script">Forjar Roteiro</span>
                </button>
            </div>
        </div>

        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-emerald-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800/80 relative z-10">
                    <h2 class="text-base font-semibold text-white flex items-center gap-2"><i class="fa-solid fa-check-double text-emerald-500"></i> Roteiro Forjado</h2>
                    <span id="contador_script_out" class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-bold border border-emerald-500/30 shadow-inner">0 palavras</span>
                </div>
                
                <textarea id="script_final_editavel" oninput="contarPalavrasLocal('script_final_editavel', 'contador_script_out')" class="flex-1 w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-5 py-4 text-emerald-500/90 text-sm leading-relaxed mb-5 focus:border-emerald-500 focus:outline-none transition-colors shadow-inner relative z-10" placeholder="Seu roteiro gerado aparecerá aqui..."></textarea>
                
                <button onclick="copiarRoteiroFinal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.4)] transition-all flex items-center justify-center gap-2 group border border-emerald-500/50 relative z-10">
                    <i class="fa-solid fa-copy group-hover:scale-110 transition-transform"></i> Copiar Roteiro
                </button>
            </div>
        </div>
    </div>
</section>

<script>
    function contarPalavrasLocal(textAreaId, contadorId) {
        const textArea = document.getElementById(textAreaId);
        if(!textArea) return;
        const texto = textArea.value.trim();
        const palavras = texto === "" ? 0 : texto.split(/\s+/).length;
        document.getElementById(contadorId).innerText = `${palavras} palavras`;
    }

    function copiarRoteiroFinal() {
        const texto = document.getElementById('script_final_editavel').value;
        if(!texto) return;
        navigator.clipboard.writeText(texto).then(() => { alert("Roteiro copiado com sucesso!"); });
    }

    async function chamarScriptForge() {
        const btn = document.getElementById('btn_gerar_script');
        const txtBtn = document.getElementById('txt_btn_script');
        const ideiaBase = document.getElementById('script_ideia_base').value;
        const canal = document.getElementById('script_canal').value || "Canal Não Informado";
        const formato = document.getElementById('script_formato').value;
        const tamanho = document.getElementById('script_tamanho').value || "Duração livre";
        const instrucoes = document.getElementById('script_instrucoes').value || "Nenhuma instrução extra.";
        
        // Pega o Tom do Gen Insights se existir, senão usa um padrão
        const tom = localStorage.getItem('ultimo_tom') || "Sombrio e Misterioso"; 

        if(!ideiaBase.trim()) return alert("Você precisa de uma Ideia Base para gerar um roteiro. Cole os dados gerados no Gen Insights."); 

        btn.classList.add('opacity-70', 'cursor-not-allowed');
        txtBtn.innerHTML = `Forjando Roteiro... <i class="fa-solid fa-circle-notch fa-spin ml-1"></i>`;
        document.getElementById('script_final_editavel').value = "O Gemini 2.5 está escrevendo o seu roteiro otimizado para retenção. Isso pode levar alguns segundos...\n\nAguarde o processamento neural...";

        try {
            const res = await fetch("/api/v1/script-forge", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    ideia_base: ideiaBase, 
                    canal: canal, 
                    formato: formato, 
                    tamanho: tamanho, 
                    tom: tom, 
                    instrucoes: instrucoes 
                })
            });
            
            if(!res.ok) {
                let erroReal = "Erro desconhecido do servidor.";
                try { const dadosErro = await res.json(); erroReal = dadosErro.detail || erroReal; } catch(e) {}
                throw new Error(erroReal);
            }

            const dados = await res.json();
            document.getElementById('script_final_editavel').value = dados.roteiro;
            contarPalavrasLocal('script_final_editavel', 'contador_script_out');

        } catch (error) { 
            document.getElementById('script_final_editavel').value = "Erro Técnico: " + error.message; 
        } finally { 
            btn.classList.remove('opacity-70', 'cursor-not-allowed'); 
            txtBtn.innerText = "Forjar Roteiro";
        }
    }
</script>
{% endblock %}
