{% extends "base.html" %}

{% block content %}
<section id="aba_script" class="aba-conteudo block">
    <div class="mb-8 relative z-10">
        <div class="flex items-center gap-3 mb-2">
            <div class="w-10 h-10 rounded-lg bg-orange-500/10 flex items-center justify-center border border-orange-500/20">
                <i class="fa-solid fa-pen-nib text-orange-400 text-lg"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-white">Script Forge</h1>
        </div>
        <p class="text-zinc-400">Forje roteiros hipnóticos para reter a atenção do espectador a cada segundo.</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -top-20 -left-20 w-40 h-40 bg-orange-500/10 rounded-full blur-[60px] pointer-events-none"></div>
                
                <h2 class="text-base font-semibold text-white mb-5 flex items-center gap-2 relative z-10">
                    <i class="fa-solid fa-sliders text-orange-500"></i> Parâmetros do Roteiro
                </h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4 relative z-10">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Nome / Tema do Canal <span class="text-orange-500">*</span></label>
                        <input type="text" id="script_canal" oninput="salvarEstado('script_canal')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors shadow-inner" placeholder="Ex: Curiosidades Sombrias...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Formato do Vídeo</label>
                        <select id="script_formato" onchange="salvarEstado('script_formato')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors appearance-none shadow-inner cursor-pointer">
                            <option value="TikTok/Shorts (Vertical)">TikTok/Shorts (Vertical)</option>
                            <option value="YouTube Longo (Horizontal)">YouTube Longo (Horizontal)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Tamanho Esperado <span class="text-orange-500">*</span></label>
                        <input type="text" id="script_tamanho" oninput="salvarEstado('script_tamanho')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors shadow-inner" placeholder="Ex: 2000 palavras ou 10 minutos">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-1.5">Tom da Narrativa <span class="text-orange-500">*</span></label>
                        <input type="text" id="script_tom" oninput="salvarEstado('script_tom')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors shadow-inner" placeholder="Ex: Misterioso, Sarcástico, Emocionante...">
                    </div>
                </div>

                <div class="mb-4 relative z-10">
                    <label class="block text-sm font-medium text-zinc-400 mb-1.5">Instruções Adicionais (Opcional)</label>
                    <input type="text" id="script_instrucoes" oninput="salvarEstado('script_instrucoes')" class="w-full bg-[#09090b] border border-zinc-700/80 rounded-lg px-4 py-2.5 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors shadow-inner" placeholder="Ex: Crie um plot twist no meio do roteiro...">
                </div>

                <div class="flex-1 flex flex-col relative z-10">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-sm font-medium text-zinc-400">Ideia Base ou Rascunho <span class="text-orange-500">*</span></label>
                        <span id="contador_script_in" class="text-xs font-bold text-zinc-500 bg-zinc-800/50 px-2 py-1 rounded border border-zinc-700">0 palavras</span>
                    </div>
                    <textarea id="script_ideia_base" oninput="salvarEstado('script_ideia_base'); contarPalavrasLocal('script_ideia_base', 'contador_script_in')" class="w-full flex-1 bg-[#09090b] border border-zinc-700/80 rounded-lg p-4 text-zinc-200 focus:outline-none focus:border-orange-500 transition-colors resize-none shadow-inner custom-scrollbar" placeholder="Cole aqui a ideia gerada no Gen Insights ou digite o seu rascunho base..."></textarea>
                </div>

                <div class="flex gap-3 mt-6 relative z-10">
                    <button id="btn_gerar_script" onclick="chamarGeradorScript()" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(249,115,22,0.3)] transition-all flex items-center justify-center gap-2 group border border-orange-500/50">
                        <i class="fa-solid fa-hammer group-hover:scale-110 transition-transform"></i> <span id="txt_btn_script">Forjar Roteiro Neural (25 Coins)</span>
                    </button>
                    <button onclick="limparScript()" class="bg-zinc-800 hover:bg-red-500/20 text-zinc-400 hover:text-red-400 border border-zinc-700 hover:border-red-500/50 font-bold py-3 px-4 rounded-lg transition-all flex items-center justify-center group" title="Limpar Tela">
                        <i class="fa-solid fa-trash-can group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="space-y-6 flex flex-col">
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-6 shadow-2xl flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-orange-500/5 rounded-full blur-[60px] pointer-events-none"></div>
                
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-zinc-800/80 relative z-10">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                        <i class="fa-solid fa-scroll text-orange-500"></i> Roteiro Forjado
                    </h2>
                    <div class="flex items-center gap-3">
                        <span id="contador_script_out" class="text-xs font-bold text-zinc-500 bg-zinc-800/50 px-3 py-1.5 rounded-lg border border-zinc-700">0 palavras</span>
                        <button onclick="enviarScriptParaVoice()" class="text-purple-400 hover:text-white transition-colors text-xs font-bold uppercase tracking-wider flex items-center gap-2 bg-purple-500/10 px-3 py-1.5 rounded-lg border border-purple-500/20 hover:bg-purple-600">
                            <i class="fa-solid fa-share-nodes"></i> Enviar p/ Voice Synth
                        </button>
                    </div>
                </div>
                
                <div class="relative flex-1 flex flex-col z-10">
                    <div id="loading_overlay" class="hidden absolute inset-0 bg-[#121214]/90 backdrop-blur-sm rounded-lg flex flex-col items-center justify-center z-20 border border-orange-500/20">
                        <i class="fa-solid fa-brain fa-fade text-4xl text-orange-500 mb-4 drop-shadow-[0_0_10px_rgba(249,115,22,0.6)]"></i>
                        <p class="text-zinc-300 text-sm font-bold animate-pulse">Forjando roteiro viral... (-25 Coins)</p>
                        <p class="text-zinc-500 text-xs mt-2">Isso pode levar alguns segundos.</p>
                    </div>
                    
                    <textarea id="script_final_editavel" oninput="salvarEstado('script_final_editavel'); contarPalavrasLocal('script_final_editavel', 'contador_script_out')" class="w-full flex-1 bg-[#121214] border border-zinc-700/50 rounded-lg p-5 text-zinc-300 focus:outline-none focus:border-orange-500/50 transition-colors resize-none shadow-inner leading-relaxed custom-scrollbar" placeholder="O seu roteiro finalizado aparecerá aqui..."></textarea>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const campos = ['script_canal', 'script_formato', 'script_tamanho', 'script_tom', 'script_instrucoes', 'script_ideia_base', 'script_final_editavel'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if(el && sessionStorage.getItem(id)) {
                el.value = sessionStorage.getItem(id);
            }
        });
        contarPalavrasLocal('script_ideia_base', 'contador_script_in');
        contarPalavrasLocal('script_final_editavel', 'contador_script_out');
    });

    function salvarEstado(id) {
        sessionStorage.setItem(id, document.getElementById(id).value);
    }

    function limparScript() {
        const campos = ['script_canal', 'script_formato', 'script_tamanho', 'script_tom', 'script_instrucoes', 'script_ideia_base', 'script_final_editavel'];
        campos.forEach(id => {
            const el = document.getElementById(id);
            if(el) { el.value = ''; sessionStorage.removeItem(id); }
        });
        contarPalavrasLocal('script_ideia_base', 'contador_script_in');
        contarPalavrasLocal('script_final_editavel', 'contador_script_out');
    }

    async function chamarGeradorScript() {
        const btn = document.getElementById('btn_gerar_script');
        const txtBtn = document.getElementById('txt_btn_script');
        const overlay = document.getElementById('loading_overlay');
        const textAreaFinal = document.getElementById('script_final_editavel');
        
        const ideiaBase = document.getElementById('script_ideia_base').value;
        const canal = document.getElementById('script_canal').value;
        const formato = document.getElementById('script_formato').value;
        const tamanho = document.getElementById('script_tamanho').value;
        const tom = document.getElementById('script_tom').value;
        const instrucoes = document.getElementById('script_instrucoes').value;

        if(!ideiaBase || !canal || !tamanho || !tom) return alert("Por favor, preencha todos os parâmetros obrigatórios (*)");

        btn.disabled = true;
        btn.classList.add('opacity-70', 'cursor-not-allowed');
        txtBtn.innerHTML = `Forjando... <i class="fa-solid fa-circle-notch fa-spin ml-1"></i>`;
        
        overlay.classList.remove('hidden');

        try {
            const res = await fetch("/api/v1/script-forge", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ideia_base: ideiaBase, canal: canal, formato: formato, tamanho: tamanho, tom: tom, instrucoes: instrucoes })
            });
            
            if(!res.ok) {
                let erroReal = "Erro desconhecido do servidor.";
                try { const dadosErro = await res.json(); erroReal = dadosErro.detail || erroReal; } catch(e) {}
                throw new Error(erroReal);
            }

            const dados = await res.json();
            textAreaFinal.value = dados.roteiro;
            
            // ==========================================
            // ATUALIZADOR DE SALDO EM TEMPO REAL
            // ==========================================
            if(dados.novo_saldo !== undefined) {
                const paineisDeCoins = document.querySelectorAll('.fa-coins');
                paineisDeCoins.forEach(icone => {
                    const elementoPai = icone.closest('p'); 
                    if(elementoPai) {
                        const textoSaldo = dados.novo_saldo.toLocaleString('pt-BR');
                        elementoPai.innerHTML = `<i class="fa-solid fa-coins"></i> ${textoSaldo} coins`;
                        
                        elementoPai.classList.add('text-orange-400', 'scale-110');
                        setTimeout(() => elementoPai.classList.remove('text-orange-400', 'scale-110'), 500);
                    }
                });
            }
            // ==========================================

            salvarEstado('script_final_editavel');
            contarPalavrasLocal('script_final_editavel', 'contador_script_out');

        } catch (error) { 
            if(error.message.includes('Coins insuficientes')) {
                textAreaFinal.value = "⚠️ " + error.message;
            } else {
                textAreaFinal.value = "Erro Técnico: " + error.message; 
            }
        } finally { 
            overlay.classList.add('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed'); 
            txtBtn.innerText = "Forjar Roteiro Neural (25 Coins)";
        }
    }
</script>
{% endblock %}
