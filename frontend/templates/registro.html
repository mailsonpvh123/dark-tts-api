{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-[#121214] p-8 rounded-2xl border border-zinc-800 w-full max-w-md shadow-2xl relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-zinc-700"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-zinc-400 tracking-tighter uppercase italic">
                <i class="fa-solid fa-plus-square mr-1 text-zinc-600"></i>DARK<span class="text-zinc-600 font-normal">CREATOR</span>
            </h1>
            <p class="text-zinc-600 text-[10px] font-bold tracking-[0.2em] mt-2 uppercase">Cadastre-se para liberar as cores</p>
        </div>

        <form id="formRegistro" class="space-y-5">
            <input type="email" id="email" required 
                class="w-full p-4 bg-[#09090b] border border-zinc-800 rounded-lg text-zinc-500 focus:border-zinc-600 outline-none transition-all placeholder:text-zinc-800" 
                placeholder="E-mail principal">
            
            <input type="password" id="password" required 
                class="w-full p-4 bg-[#09090b] border border-zinc-800 rounded-lg text-zinc-500 focus:border-zinc-600 outline-none transition-all placeholder:text-zinc-800" 
                placeholder="Crie uma senha">
            
            <button type="submit" id="btn_registrar" 
                class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold py-4 rounded-lg transition-all border border-zinc-700">
                CRIAR CONTA E GANHAR 30 COINS
            </button>
        </form>

        <div id="reg_status" class="mt-4 text-center hidden p-3 rounded-lg text-xs font-bold border border-zinc-800"></div>

        <div class="mt-8 text-center pt-6 border-t border-zinc-800/50">
            <p class="text-zinc-600 text-sm">Já é um mestre das sombras? 
                <a href="/login" class="text-zinc-400 hover:text-purple-500 font-bold underline transition-all ml-1">
                    Fazer Login →
                </a>
            </p>
        </div>
    </div>
</div>
<script>
    document.getElementById('formRegistro').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const status = document.getElementById('reg_status');
        const btn = document.getElementById('btn_registrar');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        status.classList.remove('hidden', 'border-red-500/20', 'text-red-400', 'bg-red-500/5', 'border-emerald-500/20', 'text-emerald-400', 'bg-emerald-500/5');
        status.classList.add('block', 'text-zinc-500', 'border-zinc-800');
        status.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Forjando suas credenciais...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const result = await response.json();

            if (response.ok) {
                status.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>Conta criada! Redirecionando...';
                status.classList.replace('text-zinc-500', 'text-emerald-400');
                status.classList.replace('border-zinc-800', 'border-emerald-500/20');
                status.classList.add('bg-emerald-500/5');
                
                setTimeout(() => { window.location.href = "/login"; }, 1500);
            } else {
                throw new Error(result.message || "Erro ao criar conta");
            }

        } catch (error) {
            status.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${error.message}`;
            status.classList.replace('text-zinc-500', 'text-red-400');
            status.classList.replace('border-zinc-800', 'border-red-500/20');
            status.classList.add('bg-red-500/5');
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
