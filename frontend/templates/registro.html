{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-[#121214] p-8 rounded-2xl border border-zinc-800 w-full max-w-md shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-purple-400 to-emerald-400"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-tighter text-white mb-2">
                <i class="fa-solid fa-moon text-purple-500 mr-1"></i>DARK<span class="text-zinc-500 font-normal">CREATOR</span>
            </h1>
            <p class="text-zinc-500 text-sm italic">Crie sua conta e use 6h Grátis!</p>
        </div>

        <form id="formRegistro" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2">Seu Melhor E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-[#09090b] border border-zinc-800 rounded-lg text-white focus:border-purple-500/50 outline-none transition-all">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2">Crie uma Senha</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-[#09090b] border border-zinc-800 rounded-lg text-white focus:border-purple-500/50 outline-none transition-all">
            </div>

            <button type="submit" id="btn_registrar" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition-all flex items-center justify-center gap-2 group">
                <span>Criar minha Conta</span>
                <i class="fa-solid fa-rocket group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <div id="reg_status" class="mt-4 text-center hidden p-3 rounded-lg text-xs font-bold border border-transparent"></div>
        
        <p class="mt-6 text-center text-xs text-zinc-500">Já tem conta? <a href="/login" class="text-purple-400 hover:underline">Faça login aqui</a></p>
    </div>
</div>

<script>
    document.getElementById('formRegistro').addEventListener('submit', async function(e) {
        e.preventDefault();
        const status = document.getElementById('reg_status');
        const btn = document.getElementById('btn_registrar');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        status.className = "mt-4 text-center block p-3 rounded-lg text-xs font-bold border border-zinc-800 text-zinc-500";
        status.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Preparando seu estúdio...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const result = await response.json();

            if (response.ok) {
                status.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i>Conta criada! Redirecionando...';
                status.classList.replace('text-zinc-500', 'text-emerald-400');
                status.classList.replace('border-zinc-800', 'border-emerald-500/20');
                setTimeout(() => { window.location.href = "/login"; }, 1500);
            } else {
                throw new Error(result.message || "Erro ao registrar");
            }
        } catch (error) {
            status.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> ${error.message}`;
            status.classList.replace('text-zinc-500', 'text-red-400');
            status.classList.replace('border-zinc-800', 'border-red-500/20');
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
