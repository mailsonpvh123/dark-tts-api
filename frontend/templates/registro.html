{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-[#121214] p-8 rounded-2xl border border-zinc-800 w-full max-w-md shadow-2xl relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-zinc-700"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-zinc-400 tracking-tighter uppercase italic">
                <i class="fa-solid fa-plus-square mr-1 text-zinc-600"></i>DARK<span class="text-zinc-600 font-normal">CREATOR</span>
            </h1>
            <p class="text-zinc-600 text-[10px] font-bold tracking-[0.2em] mt-2 uppercase">Cadastre-se para liberar as cores</p>
        </div>

        <form id="formRegistro" class="space-y-5">
            <input type="email" id="email" required 
                class="w-full p-4 bg-[#09090b] border border-zinc-800 rounded-lg text-zinc-500 focus:border-zinc-600 outline-none transition-all placeholder:text-zinc-800" 
                placeholder="E-mail principal">
            
            <input type="password" id="password" required 
                class="w-full p-4 bg-[#09090b] border border-zinc-800 rounded-lg text-zinc-500 focus:border-zinc-600 outline-none transition-all placeholder:text-zinc-800" 
                placeholder="Crie uma senha">
            
            <button type="submit" id="btn_registrar" 
                class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-bold py-4 rounded-lg transition-all border border-zinc-700">
                CRIAR CONTA E GANHAR 30 COINS
            </button>
        </form>

        <div id="reg_status" class="mt-4 text-center hidden p-3 rounded-lg text-xs font-bold border border-zinc-800"></div>

        <div class="mt-8 text-center pt-6 border-t border-zinc-800/50">
            <p class="text-zinc-600 text-sm">Já é um mestre das sombras? 
                <a href="/login" class="text-zinc-400 hover:text-purple-500 font-bold underline transition-all ml-1">
                    Fazer Login →
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
